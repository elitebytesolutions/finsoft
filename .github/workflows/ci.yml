name: CI

# Every push to every branch, plus the pull request, plus a nightly full run.
#
# An earlier version ran only on `pull_request` and on pushes to main and
# develop, to avoid duplicate runs. That left the case this project actually
# operates in with NO coverage: agents push feature branches and never merge,
# so a branch with no PR open yet was checked by nothing. Verified by pushing
# one and watching zero runs start.
#
# The pull_request trigger stays because it tests the MERGE result, which a
# branch push cannot — a merge can break what neither side broke alone.
#
# OPS-002 adds risk-tiered execution (see docs/workflows/ci-tiers.md): every
# push still runs `static`, `secrets`, `unit`, `audit-gate` and the
# FinancialInvariantSuite (NON_NEGOTIABLES.md §3, LEVEL 0 — no tier waives
# it), but the expensive jobs — the full database gate, the financial gate,
# end-to-end, CodeQL, and publishing images — run only when the changed paths
# warrant them, or unconditionally on develop, a release branch, a manual
# dispatch, or the nightly schedule below ("full").
on:
  push:
    branches: ['**']
  pull_request:
    branches: [main, develop]
  # So a deploy can be exercised without merging. Agents push feature branches
  # and never merge, so the automatic develop path alone could never be tested
  # by the people who build it.
  workflow_dispatch:
  # A full run every night, regardless of what did or did not change that
  # day — the safety net under the tiering. 21:00 UTC = 02:00 PKT.
  schedule:
    - cron: '0 21 * * *'

# Least privilege. No job here writes to the repository, publishes a package
# or comments on a PR, so nothing needs more than read. `images`, `codeql`
# and `deploy-staging` override this for exactly what they need.
permissions:
  contents: read

# A superseded run is wasted minutes and a confusing status. The last push
# to a ref is the one whose result matters — EXCEPT on develop and a release
# branch, where a run in flight may be a deploy: cancelling it mid-deploy is
# worse than letting two finish in order, so those refs never cancel.
#
# Keyed on the HEAD BRANCH, not the ref, so the push run and the pull-request
# run for the same branch share a group and the newer cancels the older.
# Keying on github.ref would put them in different groups (refs/heads/x versus
# refs/pull/N/merge) and run both.
concurrency:
  group: ci-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/develop' && !startsWith(github.ref, 'refs/heads/release/') }}

jobs:
  # ------------------------------------------------------------------ #
  # Decides what the rest of this run needs to do. tools/ci/classify.mjs
  # is the single source of truth — the same tool `npm run check` and
  # .githooks/pre-push use locally, so "what CI will require" is never a
  # surprise. See docs/workflows/ci-tiers.md.
  # ------------------------------------------------------------------ #
  classify:
    name: classify (risk tier)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tier: ${{ steps.classify.outputs.tier }}
      full: ${{ steps.classify.outputs.full }}
      web_changed: ${{ steps.classify.outputs.web_changed }}
      api_changed: ${{ steps.classify.outputs.api_changed }}
      worker_changed: ${{ steps.classify.outputs.worker_changed }}
      run_invariants: ${{ steps.classify.outputs.run_invariants }}
      run_db_suites: ${{ steps.classify.outputs.run_db_suites }}
      run_financial: ${{ steps.classify.outputs.run_financial }}
      run_e2e: ${{ steps.classify.outputs.run_e2e }}
      run_web_preview: ${{ steps.classify.outputs.run_web_preview }}
      run_codeql: ${{ steps.classify.outputs.run_codeql }}
      images_json: ${{ steps.classify.outputs.images_json }}
      suites_json: ${{ steps.classify.outputs.suites_json }}

    steps:
      - uses: actions/checkout@v4
        with:
          # classify.mjs diffs against the merge-base with origin/develop, so
          # it needs history — and, on a feature-branch push, a branch that
          # is not the one checked out. actions/checkout's own fetch only
          # guarantees the checked-out ref; the explicit fetch below is what
          # makes `origin/develop` resolvable regardless of event type.
          fetch-depth: 0

      - name: fetch develop for merge-base comparison
        run: git fetch origin develop --quiet

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: classify
        id: classify
        env:
          GITHUB_REF: ${{ github.ref }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        # "full" is decided HERE from GitHub's own context expressions and
        # passed in explicitly, rather than inferred inside the script from
        # environment variables. The PR #22 develop run reported full=false with
        # no changed files; deciding it in the workflow removes that failure
        # mode, and the script now echoes the event and ref it received.
        run: |
          if [[ "${{ github.event_name }}" != "pull_request" && ( "${{ github.ref }}" == "refs/heads/develop" || "${{ github.ref }}" == refs/heads/release/* || "${{ github.event_name }}" == "schedule" || "${{ github.event_name }}" == "workflow_dispatch" ) ]]; then
            node tools/ci/classify.mjs --github-output --full
          else
            node tools/ci/classify.mjs --github-output
          fi

  # ------------------------------------------------------------------ #
  # Everything that needs no database. Runs first and fails fast: a lint
  # error should not wait on a PostgreSQL container starting.
  # ------------------------------------------------------------------ #
  static:
    name: static analysis
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # From .nvmrc, so CI and developers cannot drift. The version is
          # load-bearing: packages/* run under Node's native type stripping.
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: typecheck
        run: npm run typecheck

      - name: lint
        run: npm run lint

      - name: format
        run: npm run format:check

      - name: module boundaries
        run: npm run depcruise

      # Proves every package entrypoint LOADS under plain node with no
      # transpiler. Vitest transpiles, so a suite can be green against a
      # module the runtime cannot load — which has happened here before.
      - name: runtime smoke
        run: npm run smoke

      # Migration files against their recorded checksums. Offline: it reads
      # the files and the manifest, not the database.
      - name: migration ledger
        run: npm run db:migrate:verify

      # The pre-push hook refuses direct pushes to main and develop. If it
      # stops being installable, that protection quietly disappears.
      - name: git hooks
        run: npm run hooks:verify

      # OPS-002's own tooling. The classifier decides what the rest of this
      # workflow runs — if IT is wrong, every gate downstream is wrong too,
      # silently. Cheap (no Docker) and belongs with the rest of static.
      - name: ci tooling tests (tools/ci)
        run: npm run test:ci-tools

  # ------------------------------------------------------------------ #
  # Secret scanning. NON_NEGOTIABLES rule 20.
  #
  # Gitleaks as a pinned standalone binary, checksum-verified — not the
  # GitHub Action. An action is a third party running arbitrary code in a
  # job that holds GITHUB_TOKEN; a tarball pinned to a recorded SHA256 is
  # a smaller surface and auditable from one file in this repository.
  #
  # NO continue-on-error, and none may be added. A finding fails the run,
  # and so does a scanner that cannot complete — a broken scanner must
  # never be indistinguishable from a clean repository. Runs on every tier;
  # nothing here is scheduled by risk.
  # ------------------------------------------------------------------ #
  secrets:
    name: secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
        with:
          # Full history. A secret committed months ago and deleted since is
          # still in the pack file and still compromised; the default
          # shallow clone would report the repository clean.
          fetch-depth: 0

      - name: scan
        run: bash tools/security/secret-scan.sh

      # The scanner's own negative control.
      #
      # A scan that passes proves the repository is clean OR that the scanner
      # has been configured into uselessness, and those look identical from
      # the outside. This tells them apart by planting a credential and
      # requiring the scan to FAIL.
      #
      # `--staged`, NOT the history scan. `gitleaks detect` reads COMMITS: an
      # uncommitted plant is invisible to it, which the script's own header
      # says in terms. The first version of this step planted an uncommitted
      # file and ran the history scan, so the scan correctly reported clean
      # and this step correctly called that a failure — of itself.
      #
      # Committing the plant instead would put a JWT-shaped string in history
      # permanently, which is the mistake this step exists to catch.
      #
      # It plants in the file the one allowlist entry used to cover, because
      # that is where a hole was found: `condition = "AND"` with `paths` and
      # `regexes` did not require both, so a different, unrelated token in
      # that file was suppressed too.
      - name: the scanner still catches a planted secret
        run: |
          # Assembled, because a file that plants a credential must not
          # contain one — the literal form put a real JWT-shaped string into
          # history and the scan flagged this file.
          HEAD_SEG='eyJhbGciOiJIUzI1NiJ9'
          BODY_SEG='eyJzdWIiOiJwbGFudGVkLWJ5LWNpIiwibmFtZSI6IlgifQ'
          SIGN_SEG='QmxhaEJsYWhCbGFoU2lnbmF0dXJlVmFsdWVYWVo'
          {
            echo ''
            echo "// ${HEAD_SEG}.${BODY_SEG}.${SIGN_SEG}"
          } >> packages/observability/src/redact.test.ts
          git add packages/observability/src/redact.test.ts

          if bash tools/security/secret-scan.sh --staged; then
            echo "::error::The staged scan PASSED with a credential staged for commit."
            echo "::error::It is not scanning what it claims to scan. Check .gitleaks.toml"
            echo "::error::for an allowlist whose scope is wider than its description."
            exit 1
          fi
          echo "  planted secret was caught — the staged scan is doing its job"
          git restore --staged packages/observability/src/redact.test.ts
          git checkout -- packages/observability/src/redact.test.ts

  # ------------------------------------------------------------------ #
  # Every workspace unit test, with NO database. OPS-002 item 3 moved the
  # one test that needed Postgres (apps/api's app.spec.ts) to
  # tests/integration/api-app.spec.ts, so this is now genuinely Docker-free
  # — the same property `npm run check` / .githooks/pre-push depend on
  # locally. Always runs, on every tier.
  # ------------------------------------------------------------------ #
  unit:
    name: unit tests (no database)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: workspace unit tests
        run: npm run test --workspaces --if-present

  # ------------------------------------------------------------------ #
  # NON_NEGOTIABLES.md §3 — LEVEL 0:
  #   "A dedicated test suite that runs on every PR, not nightly. If it
  #   fails, nothing merges — no exceptions, no --skip, no 'flaky, re-run'."
  #
  # A risk tier is a scheduling decision; this is not scheduled by risk. It
  # runs on a one-line docs fix exactly as it runs on a posting-engine
  # rewrite, and it is not gated by `classify`. The REST of the financial
  # gate (full test:accounting, reconciliation, golden scenarios) is scoped
  # by tier in the `financial` job below — that scoping is legitimate
  # because those suites are not the invariant suite this rule names.
  # ------------------------------------------------------------------ #
  invariants:
    name: FinancialInvariantSuite (every PR — LEVEL 0)
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: environment
        run: cp .env.example .env

      - name: data plane
        run: docker compose up -d --wait

      - name: migrate
        run: npm run db:migrate

      - name: migrate test cluster
        run: npm run db:migrate:test

      - name: FinancialInvariantSuite
        run: npm run test:financial-invariant-suite

      - name: compose logs on failure
        if: failure()
        run: docker compose logs --no-color --tail 200

      - name: tear down
        if: always()
        run: docker compose down -v

  # ------------------------------------------------------------------ #
  # The full database gate: schema, security (tenant isolation),
  # integration (includes the moved apps/api app.spec.ts and the worker's
  # outbox/Redis suite), performance, and the schema-drift check. T2/T3 or
  # a full run — auth, permissions, tenancy, migrations and infra changes
  # are exactly the changes these suites exist to catch.
  # ------------------------------------------------------------------ #
  db-suites:
    name: database suites
    needs: [classify]
    if: needs.classify.outputs.run_db_suites == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: environment
        run: cp .env.example .env

      # INFRASTRUCTURE.md:257 — "docker compose down -v && docker compose up
      # must produce a working system from scratch." --wait blocks until
      # every healthcheck passes, so a test never races a starting database.
      - name: data plane
        run: docker compose up -d --wait

      # Roles, privileges, encoding, locale provider and isolation level.
      # finsoft_app must have neither BYPASSRLS nor SUPERUSER.
      - name: data plane assertions
        run: npm run db:verify

      - name: migrate
        run: npm run db:migrate

      - name: migrate test cluster
        run: npm run db:migrate:test

      # assertGeneratedTypesAreExact catches a MALFORMED committed schema; it
      # cannot catch a STALE one, so the file is regenerated against the
      # freshly-migrated database and any diff fails the run.
      - name: schema types match the migrated database
        run: |
          npm run db:codegen
          if ! git diff --quiet -- packages/database/src/generated/schema.d.ts; then
            echo "::error::generated/schema.d.ts is stale. Run 'npm run db:codegen' and commit the result."
            git --no-pager diff -- packages/database/src/generated/schema.d.ts
            exit 1
          fi

      - name: schema suite
        run: npm run test:schema

      - name: security suite (tenant isolation)
        run: npm run test:security

      - name: integration suite
        run: npm run test:integration

      - name: performance suite
        run: npm run test:performance

      - name: compose logs on failure
        if: failure()
        run: docker compose logs --no-color --tail 200

      - name: tear down
        if: always()
        run: docker compose down -v

  # ------------------------------------------------------------------ #
  # The rest of the financial gate, beyond the always-on invariant suite:
  # full test:accounting (golden scenarios + cross-engine rounding, which
  # re-runs the invariant suite alongside them — harmless duplication on a
  # tier that specifically touches posting/money/inventory/tax/periods) and
  # test:reconciliation. T3 or a full run.
  # ------------------------------------------------------------------ #
  financial:
    name: financial gate
    needs: [classify]
    if: needs.classify.outputs.run_financial == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: environment
        run: cp .env.example .env

      - name: data plane
        run: docker compose up -d --wait

      - name: migrate
        run: npm run db:migrate

      - name: migrate test cluster
        run: npm run db:migrate:test

      - name: accounting suite
        run: npm run test:accounting

      - name: reconciliation suite
        run: npm run test:reconciliation

      - name: compose logs on failure
        if: failure()
        run: docker compose logs --no-color --tail 200

      - name: tear down
        if: always()
        run: docker compose down -v

  # ------------------------------------------------------------------ #
  # Browser-to-API journeys. T1+ (web, api or worker actually changed) or
  # a full run — not every T2 change touches app code (a migration alone
  # does not), so this stays keyed on app-code change rather than tier.
  # ------------------------------------------------------------------ #
  e2e:
    name: e2e
    needs: [classify]
    if: needs.classify.outputs.run_e2e == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: environment
        run: cp .env.example .env

      - name: data plane
        run: docker compose up -d --wait

      - name: data plane assertions
        run: npm run db:verify

      - name: migrate
        run: npm run db:migrate

      # A browser against the real API, started from dist — the same
      # artefact shape the container runs.
      - name: install browser
        run: npx playwright install --with-deps chromium

      - name: e2e
        run: npm run test:e2e

      - name: e2e report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore

      - name: compose logs on failure
        if: failure()
        run: docker compose logs --no-color --tail 200

      - name: tear down
        if: always()
        run: docker compose down -v

  # ------------------------------------------------------------------ #
  # A fast, no-Docker preview build of apps/web, for a change classified
  # T0 (docs/mocks/prototype) that also touches apps/web/src/mocks/** —
  # or, more generally, any apps/web change on a run that is not already
  # getting the heavier e2e treatment or a full run. Artifact only.
  # ------------------------------------------------------------------ #
  web-preview:
    name: web preview build
    needs: [classify]
    if: needs.classify.outputs.run_web_preview == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
        run: npm run build --workspace @finsoft/web

      - uses: actions/upload-artifact@v4
        with:
          name: web-preview-build
          path: apps/web/.next
          retention-days: 3
          if-no-files-found: error

  # ------------------------------------------------------------------ #
  # CodeQL. IMPLEMENTATION.md §10 lists SAST as required; nothing
  # implemented it until now. T2/T3 or a full run — auth, permissions,
  # tenancy, migrations, infra and the financial kernels are exactly the
  # surface a static analyser earns its runtime on.
  # ------------------------------------------------------------------ #
  codeql:
    name: CodeQL
    needs: [classify]
    if: needs.classify.outputs.run_codeql == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # No `security-events: write` and no upload. Code scanning (the SARIF
    # upload target) needs GitHub Advanced Security, which this private
    # repository on the Free plan does not have — the same plan limit as
    # GAP-001's secret scanning. With the default upload the analyze step
    # failed on EVERY run, and because deploy-staging needs this job, no
    # develop merge deployed from OPS-002 (99e7118) until this fix. The scan
    # itself still runs in full; the gate is enforced here instead: any
    # result at SARIF level "error" fails the job, and the SARIF is kept as
    # an artifact for review.
    permissions:
      contents: read
      # The analyze step reads its own workflow run (telemetry and run
      # metadata) and fails with "Resource not accessible by integration"
      # without this. Read-only; it grants nothing to write.
      actions: read

    steps:
      - uses: actions/checkout@v4

      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript

      - uses: github/codeql-action/analyze@v3
        id: analyze
        with:
          upload: never

      - name: upload SARIF as an artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: codeql-sarif
          path: ${{ steps.analyze.outputs.sarif-output }}
          if-no-files-found: warn
          retention-days: 14

      - name: fail on error-level findings
        run: |
          set -euo pipefail
          count=$(jq -s '[.[].runs[].results[]? | select((.level // "warning") == "error")] | length' "${{ steps.analyze.outputs.sarif-output }}"/*.sarif)
          total=$(jq -s '[.[].runs[].results[]?] | length' "${{ steps.analyze.outputs.sarif-output }}"/*.sarif)
          echo "CodeQL: ${total} result(s), ${count} at level error"
          jq -r '.runs[].results[]? | select((.level // "warning") == "error") | "::error file=\(.locations[0].physicalLocation.artifactLocation.uri),line=\(.locations[0].physicalLocation.region.startLine)::\(.ruleId): \(.message.text)"' "${{ steps.analyze.outputs.sarif-output }}"/*.sarif
          test "$count" -eq 0

  # ------------------------------------------------------------------ #
  # The deployable artefacts. "One artefact" (INFRASTRUCTURE.md): the image
  # digest that passed staging is what runs in production — never rebuilt.
  #
  # On a PR or feature push: build only the images whose paths changed, and
  # never push. On develop, a release branch, workflow_dispatch or the
  # nightly schedule (classify's "full"): every image ends up tagged
  # :${{ github.sha }} — a changed image is built and pushed fresh; an
  # UNCHANGED one has its existing :develop digest retagged to :${{ sha }}
  # with `docker buildx imagetools create` (no rebuild, so it stays the
  # exact bytes that already passed staging), falling back to a full
  # build+push only if :develop does not exist yet (first run). This is
  # what keeps infrastructure/staging/deploy.sh — which pulls :$SHA for all
  # three images unconditionally — working without changes.
  # ------------------------------------------------------------------ #
  images:
    name: container images (${{ matrix.image }})
    needs: [classify]
    runs-on: ubuntu-latest
    timeout-minutes: 25

    # Only this job may write packages, and only this job gets the token.
    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        image: [api, worker, web]

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: registry login
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          # The run's own short-lived token. No long-lived PAT is stored
          # anywhere, and this one expires when the job ends.
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: does this image need building?
        id: decide
        run: |
          echo "changed=${{ contains(fromJSON(needs.classify.outputs.images_json), matrix.image) }}" >> "$GITHUB_OUTPUT"
          echo "full=${{ needs.classify.outputs.full }}" >> "$GITHUB_OUTPUT"

      - name: compute tags
        id: tags
        if: steps.decide.outputs.changed == 'true'
        run: |
          BASE="ghcr.io/${{ github.repository }}-${{ matrix.image }}"
          SHA="${{ github.sha }}"
          {
            echo 'tags<<TAGS_EOF'
            echo "$BASE:$SHA"
            if [ "${{ steps.decide.outputs.full }}" = "true" ]; then
              echo "$BASE:develop"
            fi
            echo 'TAGS_EOF'
          } >> "$GITHUB_OUTPUT"

      # Runs whenever this image's own paths changed — on a PR that means
      # "prove it still builds" (push: false); on a full run it also
      # publishes both the immutable :sha tag and the moving :develop tag.
      - name: build ${{ matrix.image }}
        if: steps.decide.outputs.changed == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infrastructure/docker/Dockerfile.${{ matrix.image }}
          push: ${{ steps.decide.outputs.full == 'true' }}
          tags: ${{ steps.tags.outputs.tags }}
          # `org.opencontainers.image.source` is what LINKS the package to
          # this repository, and the link is what makes a workflow's
          # GITHUB_TOKEN able to read/write it — the package names here
          # (finsoft-api / finsoft-worker / finsoft-web) do not match the
          # repository name, so GitHub cannot infer the link on its own.
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.created=${{ github.event.repository.updated_at }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

      # Runs only on a full run, and only when this image did NOT change —
      # the case deploy.sh needs covered: it pulls :$SHA for all three
      # images unconditionally, so an unchanged image still needs that tag.
      - name: retag unchanged image's :develop digest as :${{ github.sha }}
        if: steps.decide.outputs.full == 'true' && steps.decide.outputs.changed != 'true'
        run: |
          IMAGE="ghcr.io/${{ github.repository }}-${{ matrix.image }}"
          SRC="$IMAGE:develop"
          DST="$IMAGE:${{ github.sha }}"
          if docker buildx imagetools inspect "$SRC" >/dev/null 2>&1; then
            echo "retagging $SRC -> $DST — no rebuild, this image did not change"
            docker buildx imagetools create -t "$DST" "$SRC"
          else
            echo "::warning::$SRC does not exist yet (first full run on this repository?) — building instead of retagging"
            docker buildx build \
              --push \
              -t "$DST" -t "$SRC" \
              -f "infrastructure/docker/Dockerfile.${{ matrix.image }}" \
              --label "org.opencontainers.image.source=https://github.com/${{ github.repository }}" \
              --label "org.opencontainers.image.revision=${{ github.sha }}" \
              --cache-from "type=gha,scope=${{ matrix.image }}" \
              --cache-to "type=gha,mode=max,scope=${{ matrix.image }}" \
              .
          fi

  # ------------------------------------------------------------------ #
  # Staging deploy. INFRASTRUCTURE §3: develop deploys to Contabo
  # automatically. Production is a different provider, needs a human, and
  # has no path from here.
  #
  # `needs` IS the security property. This job cannot start unless every
  # gate below passed in THIS run — which is to say, on this exact commit.
  # Every job listed here always RUNS (never merely "is skipped as
  # passing") whenever this job's own `if` is true, because this job's own
  # condition (develop / workflow_dispatch) is exactly the condition under
  # which classify's "full" is also true — so db-suites, financial, e2e,
  # images and codeql are never silently bypassed here. web-preview is
  # deliberately NOT in this list: it is mutually exclusive with a full run
  # by design (see classify.mjs) and would otherwise make this job wait on
  # a job that is always skipped whenever this job can run.
  # ------------------------------------------------------------------ #
  deploy-staging:
    name: deploy to staging
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs:
      [static, secrets, unit, invariants, db-suites, financial, e2e, images, codeql, audit-gate]
    if: github.ref == 'refs/heads/develop' || github.event_name == 'workflow_dispatch'

    # The workflow default is `contents: read`, and only the images job
    # overrides it. Without this the deploy job's GITHUB_TOKEN could not pull
    # from GHCR at all — the registry login would succeed and every pull
    # would be denied. Read, not write: this job publishes nothing.
    permissions:
      contents: read
      packages: read

    steps:
      - uses: actions/checkout@v4

      - name: authorise
        env:
          KEY: ${{ secrets.STAGING_SSH_KEY }}
          HOSTKEYS: ${{ secrets.STAGING_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          # The trailing newline is required, not cosmetic. OpenSSH rejects a
          # private key whose final line is unterminated with
          # "error in libcrypto" — which reads like a corrupt or wrong-format
          # key rather than a missing byte, and sends you looking in the wrong
          # place. GitHub strips the trailing newline from a secret, so it has
          # to be put back here.
          printf '%s\n' "$KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          # A pinned host key. Without it, StrictHostKeyChecking=no accepts
          # whatever answers on that address — the entire value of host
          # verification, given away to save one secret.
          printf '%s\n' "$HOSTKEYS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: ship configuration
        env:
          HOST: ${{ vars.STAGING_HOST }}
          SSH_USER: ${{ vars.STAGING_USER }}
        run: |
          ssh "$SSH_USER@$HOST" 'install -d /opt/finsoft/postgres/init'
          scp infrastructure/staging/compose.yaml "$SSH_USER@$HOST:/opt/finsoft/compose.yaml"
          scp infrastructure/staging/Caddyfile "$SSH_USER@$HOST:/opt/finsoft/Caddyfile"
          scp infrastructure/docker/postgres/init/* "$SSH_USER@$HOST:/opt/finsoft/postgres/init/"
          scp infrastructure/staging/deploy.sh "$SSH_USER@$HOST:/opt/finsoft/deploy.sh"

      # Digests, not tags. A tag is a moving pointer; a digest is the exact
      # bytes that passed the gate above, which is what
      # infrastructure/README.md requires be the thing that actually runs.
      - name: deploy
        env:
          HOST: ${{ vars.STAGING_HOST }}
          SSH_USER: ${{ vars.STAGING_USER }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
          SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
        run: |
          # Run the script as a FILE on the host, with stdin closed (-n).
          #
          # It used to be piped in: `ssh … 'bash -s' < deploy.sh`. That looks
          # equivalent and is not — the script arrives on stdin, so any
          # command inside it that reads stdin consumes THE REST OF THE
          # SCRIPT. `docker compose run` attaches stdin by default, so the
          # migrate container swallowed everything after it. The `up -d` never
          # ran, bash reached EOF and exited 0, and the deploy reported
          # success with only postgres and redis running.
          ssh -n "$SSH_USER@$HOST" \
            REGISTRY_TOKEN="$REGISTRY_TOKEN" ACTOR="$ACTOR" SHA="$SHA" REPO="$REPO" \
            'bash /opt/finsoft/deploy.sh'

      # A deploy that reports success without asking the thing whether it
      # works is a deploy that reports success.
      #
      # `vars.STAGING_URL` is the deployment's real, HTTPS, public address
      # (PRD §6.1: `https://31-220-74-159.sslip.io` on the current host) — a
      # repo variable rather than a hardcoded literal so the hostname can
      # change without editing this file. REQUIRED, with no fallback: the
      # Caddyfile (infrastructure/staging/Caddyfile) has exactly one site
      # block, for the `31-220-74-159.sslip.io` hostname. A request with
      # Host: 31.220.74.159 (what a fallback to `http://$STAGING_HOST` would
      # send) matches no site block in Caddy and gets nothing usable back —
      # so a fallback here would not be a degraded smoke test, it would be a
      # smoke test that silently tests nothing. Fail fast instead
      # (docs/workflows/ci-tiers.md has the cut-over steps).
      - name: smoke
        env:
          BASE: ${{ vars.STAGING_URL }}
        run: |
          if [ -z "$BASE" ]; then
            echo "::error::vars.STAGING_URL is not set. Set Settings -> Secrets and variables -> Actions -> Variables -> STAGING_URL to the staging HTTPS origin (e.g. https://31-220-74-159.sslip.io) before deploy-staging can run smoke tests. There is no bare-IP fallback: the Caddyfile has no site block for the bare host, so http://\$STAGING_HOST matches nothing. See docs/workflows/ci-tiers.md." >&2
            exit 1
          fi
          bash infrastructure/staging/smoke.sh "$BASE"

      # A real browser against the real deployment, which curl cannot stand in
      # for: smoke.sh proves each endpoint answers, not that a document loaded
      # from the web origin can reach the API through the proxy. That is the
      # arrangement ADR-0009's SameSite=Strict refresh cookie depends on.
      #
      # Runs HERE and not in the pull-request suite, so an unrelated change
      # never fails because staging happened to be restarting.
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: install browser
        run: npx playwright install --with-deps chromium

      # Same requirement as the smoke step above, and for the same reason:
      # `http://$STAGING_HOST` matches no site block in the Caddyfile, so a
      # fallback here would point a real browser at a host that answers
      # nothing meaningful rather than exercising the deployed origin.
      - name: browser against the deployed origin
        env:
          BASE: ${{ vars.STAGING_URL }}
        run: |
          if [ -z "$BASE" ]; then
            echo "::error::vars.STAGING_URL is not set. Set Settings -> Secrets and variables -> Actions -> Variables -> STAGING_URL to the staging HTTPS origin (e.g. https://31-220-74-159.sslip.io) before deploy-staging can run the deployed Playwright suite. There is no bare-IP fallback: the Caddyfile has no site block for the bare host. See docs/workflows/ci-tiers.md." >&2
            exit 1
          fi
          export E2E_BASE_URL="$BASE"
          npx playwright test --config tests/e2e/playwright.deployed.config.ts

  # ------------------------------------------------------------------ #
  # GAP-002 (docs/COMPLIANCE_GAPS.md) — the blocking half. Fails the run on
  # any HIGH or CRITICAL finding in a PRODUCTION dependency that is not
  # named in tools/ci/audit-allowlist.json with an owner, a rationale and a
  # live review-by date. Runs on every tier; this is a security gate, not a
  # scheduled-by-risk one.
  # ------------------------------------------------------------------ #
  audit-gate:
    name: dependency audit (blocking — production deps)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: audit gate
        run: npm run audit:gate

  # ------------------------------------------------------------------ #
  # GAP-002 — the advisory half. Reports everything, including dev
  # dependencies and moderate/low findings, and blocks nothing:
  # `continue-on-error` cannot express "block on high/critical in
  # production deps, report the rest" — audit-gate above is what does that.
  # This stays advisory so the full picture is still visible without a
  # permanently-red, ignored check.
  # ------------------------------------------------------------------ #
  audit:
    name: dependency audit (advisory — full report)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: audit
        run: npm audit --audit-level=high
